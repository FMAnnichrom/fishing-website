services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ML_SERVICE_URL=http://ml-service:8000
      - MONGODB_URI=mongodb://mongo:27017/phishing_detector
      - ENABLE_WEBSITE_INSPECTION=false
      - GOOGLE_SAFE_BROWSING_API_KEY=${GOOGLE_SAFE_BROWSING_API_KEY:-}
      - PHISHTANK_API_KEY=${PHISHTANK_API_KEY:-}
      - URLHAUS_AUTH_KEY=${URLHAUS_AUTH_KEY:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-change-me-in-production}
    depends_on:
      - ml-service
      - mongo

  ml-service:
    image: python:3.10-slim
    working_dir: /app/ml-service
    volumes:
      - ./ml-service:/app/ml-service
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python training/train_model.py &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
